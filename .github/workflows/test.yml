name: Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_call:

jobs:
  build:
    name: Build (${{ matrix.os }} - ${{ matrix.build.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        build:
          - name: debug
            flag: ""
          - name: release
            flag: "--release"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Environment
        uses: ./.github/actions/setup-env
        with:
          nextest: true
          cache-key: ${{ matrix.os }}-${{ matrix.build.name }}

      - name: Build Project
        shell: bash
        run: |
          cargo build ${{ matrix.build.flag }}
          cargo test --no-run ${{ matrix.build.flag }}
          $HEPHGL_GUI_PREFIX cargo nextest run --no-run ${{ matrix.build.flag }}

  unit-tests:
    name: Run Unit Tests (${{ matrix.os }} - ${{ matrix.build.name }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        build:
          - name: debug
            flag: ""
          - name: release
            flag: "--release"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Environment
        uses: ./.github/actions/setup-env
        with:
          cache-key: ${{ matrix.os }}-${{ matrix.build.name }}

      - name: Run Tests
        run: cargo test ${{ matrix.build.flag }}

  integration-tests:
    name: Run Integration Tests (${{ matrix.os }} - ${{ matrix.build.name }})
    needs: unit-tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        build:
          - name: debug
            flag: ""
          - name: release
            flag: "--release"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Environment
        uses: ./.github/actions/setup-env
        with:
          nextest: true
          cache-key: ${{ matrix.os }}-${{ matrix.build.name }}

      - name: Run Tests
        shell: bash
        run: $HEPHGL_GUI_PREFIX cargo nextest run ${{ matrix.build.flag }}

  coverage:
    name: Code Coverage
    needs: integration-tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Environment
        uses: ./.github/actions/setup-env
        with:
          nextest: true
          llvm-cov: true
          cache-key: ubuntu-latest-debug

      - name: Run Code Coverage
        shell: bash
        run: $HEPHGL_GUI_PREFIX cargo llvm-cov nextest

      - name: Generate Report
        run: cargo llvm-cov report --fail-under-functions 80 --fail-under-lines 80 --fail-under-regions 80

      - name: Generate LCOV
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: cargo llvm-cov report --lcov --output-path lcov.info

      - name: Upload to Coveralls
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: lcov.info
          format: lcov
