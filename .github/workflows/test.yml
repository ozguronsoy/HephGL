name: Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_call:

jobs:
  unit-tests:
    name: Run Unit Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Environment
        uses: ./.github/actions/setup-env

      - name: Run Tests
        run: cargo test

  integration-tests:
    name: Run Integration Tests (${{ matrix.os }})
    needs: unit-tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Environment
        uses: ./.github/actions/setup-env
        with:
          nextest: true

      - name: Run Tests
        shell: bash
        run: $HEPHGL_NEXTEST_PREFIX cargo nextest run

  coverage:
    name: Code Coverage
    needs: integration-tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Environment
        uses: ./.github/actions/setup-env
        with:
          nextest: true
          llvm-cov: true

      - name: Run Unit Tests Coverage
        run: cargo llvm-cov --lib

      - name: Run Integration Tests Coverage
        shell: bash
        run: $HEPHGL_NEXTEST_PREFIX cargo llvm-cov nextest

      - name: Generate Report
        run: cargo llvm-cov report --fail-under-lines 80 --fail-under-regions 80
