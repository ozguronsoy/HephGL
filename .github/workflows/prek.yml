name: Pre Commit

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_call:

jobs:
  prek:
    name: Run prek
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Environment
        uses: ./.github/actions/setup-env
        with:
          nightly: true
          clippy: true

      - name: Install prek
        run: cargo install --locked prek

      - name: Run prek 
        run: prek run --all-files
