name: Examples

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_call:

jobs:
  examples:
    name: Run Examples (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Environment
        uses: ./.github/actions/setup-env
        with:
          nextest: true
          cache-key: examples-${{ matrix.os }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Run Examples
        shell: bash
        run: $HEPHGL_GUI_PREFIX python scripts/run_examples.py
