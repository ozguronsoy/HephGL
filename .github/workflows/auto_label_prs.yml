name: Auto Label PRs

on:
  pull_request_target:
    types: [opened, synchronized, reopened]

jobs:
  label:
    name: Assign Labels
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Apply labels
        uses: actions/labeler@v7
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"
          configuration-path: .github/pr_labels.yml
          sync-labels: true
