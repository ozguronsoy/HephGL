[package]
name = "heph-gl"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
authors = ["Özgür Toprak Önsoy <ozguronsoy@gmail.com>"]
description = "An experimental cross-platform graphics library."
license = "BSD-3-Clause" 
repository = "https://github.com/ozguronsoy/HephGL"
readme = "README.md"
keywords = ["vulkan"]
categories = ["graphics"]

include = [
    "/src/",
    "/LICENSE",
    "/README.md",
]

[dependencies]
renkrs = "0.1.1"
glam = "0.34.1"
raw-window-handle = "0.6.2"
ash = { version = "0.38.0", optional = true }
ash-window = { version = "0.13.0", optional = true }
vk-mem = { version = "0.5.0", optional = true }
const-str = "1.1.0"
spirq = "1.3.0"
fontdue = { version = "0.9.4", optional = true }
fontdb = { version = "0.24", optional = true }
ttf-parser = { version = "0.25.1", optional = true }
lyon_tessellation = { version = "1.0", optional = true }
gltf = { version = "1.4.1", default-features = false, features = ["utils"], optional = true }

[dev-dependencies]
bytemuck = "1.25.0"
winit = "0.30.13"
libtest-mimic = "0.8"
rand = "0.10.2"
paste = "1.0.15"
image = "0.25.10"
exr = "1.74.2"
ddsfile = "0.6.0"

[profile.dev.package."*"]
opt-level = 3

[features]
vulkan = ["dep:ash", "dep:ash-window", "dep:vk-mem"]
directx = []
metal = []
opengl = []
text = ["dep:fontdue", "dep:fontdb", "dep:ttf-parser", "dep:lyon_tessellation"]
gltf = ["dep:gltf"]

[[example]]
name = "render_text"
required-features = ["text"]
[[example]]
name = "render_mesh"
required-features = ["gltf"]
[[example]]
name = "render_animated_mesh"
required-features = ["gltf"]
[[example]]
name = "render_scene_medieval_courtyard"
required-features = ["gltf"]

[[test]]
name = "vulkan"
harness = false

[lints.rust]
unreachable_patterns = "deny"
unused_variables = "deny"
unused_results = "deny"
unused_macros = "deny"
unused_imports = "deny"
unconditional_recursion = "deny"
overflowing_literals = "deny"
dead_code = "deny"

while_true = "deny"

non_camel_case_types = "deny"
non_snake_case = "deny"
non_upper_case_globals = "deny"

[lints.clippy]
too_many_arguments = "allow"
manual_range_contains = "allow"
result_large_err = "allow"
uninlined_format_args = "deny"
